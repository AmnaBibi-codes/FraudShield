{% extends "base.html" %}

{% block title %}
Login - FraudShield
{% endblock %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card bg-dark border-secondary shadow-lg p-4 rounded-4 mt-5">

                <h2 class="text-danger text-center fw-bold mb-2">
                    Login
                </h2>

                <p class="text-secondary text-center mb-4">
                    Access your FraudShield account
                </p>

                <form method="POST" autocomplete="on">

                    <div class="mb-3">

                        <label class="form-label text-light">
                            Email Address
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control bg-secondary text-white border-0"
                            placeholder="Enter Email"
                            autocomplete="email"
                            required
                        >

                    </div>

                    <div class="mb-4">

                        <label class="form-label text-light">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control bg-secondary text-white border-0"
                            placeholder="Enter Password"
                            autocomplete="current-password"
                            required
                        >

                    </div>

                    <div class="form-check mb-4">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="rememberMe"
                            checked
                        >

                        <label
                            class="form-check-label text-light"
                            for="rememberMe"
                        >
                            Remember Me
                        </label>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-danger w-100 fw-bold py-2 rounded-pill"
                    >
                        Login
                    </button>

                </form>

                {% if message %}

                <div class="alert alert-danger mt-4 text-center">
                    {{ message }}
                </div>

                {% endif %}

                <p class="text-center mt-4 mb-0 text-secondary">

                    Don't have an account?

                    <a
                        href="/signup"
                        class="text-danger text-decoration-none fw-bold"
                    >
                        Signup
                    </a>

                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
